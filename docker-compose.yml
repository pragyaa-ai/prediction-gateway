version: '3.8'

services:
  # ML Gateway with embedded OpenSearch
  gateway:
    build: .
    container_name: ml-gateway
    ports:
      - "8000:8000"  # Gateway API
      - "9200:9200"  # OpenSearch REST API
      - "9600:9600"  # OpenSearch performance analyzer
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - OPENSEARCH_HOST=localhost
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=Admin@123
      - OPENSEARCH_USE_SSL=false
      - OPENSEARCH_VERIFY_CERTS=false
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - gateway-network

volumes:
  opensearch-data:

networks:
  gateway-network:
    driver: bridge
