version: '3.8'

services:
  # ML Gateway with embedded OpenSearch
  gateway:
    build: .
    container_name: ml-gateway
    ports:
      - "8000:8000"  # Gateway API
      - "9200:9200"  # OpenSearch REST API
      - "9600:9600"  # OpenSearch performance analyzer
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - OPENSEARCH_HOST=localhost
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=Adm!9Kq7Zx@42
      - OPENSEARCH_USE_SSL=false
      - OPENSEARCH_VERIFY_CERTS=false
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - gateway-network

  # OpenSearch Dashboards (Web GUI)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://gateway:9200
      - HOME=/usr/share/opensearch-dashboards
    depends_on:
      - gateway
    networks:
      - gateway-network

volumes:
  opensearch-data:

networks:
  gateway-network:
    driver: bridge
