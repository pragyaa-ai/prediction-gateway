# Azure AutoML LOS model (local) – full on-disk pipeline, no cloud dependency.
# Inputs: same fields as los_fakeeh_ksa (see adapters/mappers.py los_fakeeh_input).
# Output: predicted LOS in days with category label (SHORT / MEDIUM / LONG).
los_fakeeh_ksa_local:
  provider: local_artifact
  endpoint_url: ""
  local_artifact_path: models/local-models/los_prediction_ksa/model.pkl
  local_artifact_format: azure_automl_pickle
  local_model_kind: azure_automl_pipeline
  auth_type: none
  api_key: null
  timeout_ms: 30000
  version: "1.0-local"
  input_mapper: azure_automl_noop
  output_mapper: los_local
  enabled: true

# Azure AutoML Delay Arrival model (local) – full on-disk pipeline, no cloud dependency.
# Inputs: same 23-column schema as delay_fakeeh_dubai (see adapters/mappers.py delay_fakeeh_dubai_input).
# Output: predicted delay in minutes.
delay_fakeeh_ksa_local:
  provider: local_artifact
  endpoint_url: ""
  local_artifact_path: models/local-models/Fakeeh-Delay-Arrival_ksa/model.pkl
  local_artifact_format: azure_automl_pickle
  local_model_kind: azure_automl_pipeline
  auth_type: none
  api_key: null
  timeout_ms: 30000
  version: "1.0-local"
  input_mapper: azure_automl_noop
  output_mapper: delay_local
  enabled: true
